<header><div><div class="eyebrow">HEALTH CONTENT RADAR</div><h1>健康内容雷达</h1><div class="sub">团队只读分享版 · 数据快照</div></div><span class="muted" id="export-time"></span></header>
<div class="layout"><aside><nav aria-label="看板模块"><button data-view="hot">↗ 全网热榜</button><button data-view="content">◈ 热门内容</button></nav><section id="topic-sidebar" hidden><div class="section-label">我的健康赛道</div><div id="topic-list"></div></section><div class="side-note">数据源 · RedFox API<br>本页面只读，不发起采集或推送。<br>数据由管理员在本地刷新后重新发布。</div></aside><main><div id="track-tabs" class="tabs" hidden><button data-track="domestic">国内赛道</button><button data-track="international">国际赛道 · YouTube</button></div><div id="summary" class="summary" hidden></div><div id="notice"></div><div id="body"><div class="empty">正在读取已发布数据…</div></div><footer>来自红狐搜索候选库，不代表全站穷尽排名。互动指标为采集时累计值；原平台内容可能需登录或已失效。网页不会自动采集，展示时间以每份快照为准。</footer></main></div>
<script>

 $('#body').innerHTML=html;
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||!data)return;if(b.dataset.track){track=b.dataset.track;topicId=data.tracks[track].topics[0]?.id;platform=track==='international'?'youtube':'douyin';}if(b.dataset.page){page+=Number(b.dataset.page);render();return;}if(b.dataset.view)view=b.dataset.view;if(b.dataset.topic){topicId=b.dataset.topic;view='content';}if(b.dataset.platform)platform=b.dataset.platform;if(b.dataset.window)hours=Number(b.dataset.window);page=1;render();});
